apiVersion : postgresql.cnpg.io/v1
kind: Cluster
metadata:
    name: postgres-cluster
    namespace: todo-production
spec:
    instances: 2
    storage:
        size: 5Gi 

    backup:
        barmanObjectStore:
            destinationPath: s3://vmind-postgres-backups/
            endpointURL: https://s3.portvmind.com 
            s3Credentials:
                accessKeyId:
                    name: s3-creds
                    key: ACCESS_KEY_ID
                secretAccessKey:
                    name: s3-creds
                    key: SECRET_ACCESS_KEY